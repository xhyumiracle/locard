[project]
name = "blockchainmas"
version = "0.1.0"
description = "Blockchain Forensics Multi Agent System - Cross-chain transaction tracing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx[socks]>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10.8",
    "mashumaro>=3.17",
]

[project.scripts]
blockchainmas = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
