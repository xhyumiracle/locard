[pytest]
# Pytest configuration for BlockchainMAS

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers for categorizing tests
markers =
    tool: tests for individual tools (API clients, converters)
    logic: tests for core logic (scoring, validation, formatting)
    integration: tests for multi-component integration
    slow: tests that take longer to run (may call external APIs)

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info

# Capture settings
# Show print statements for debugging
capture = no
